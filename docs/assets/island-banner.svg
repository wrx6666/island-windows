<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Island for Windows</title><desc id="desc">Минималистичный остров для музыки, погоды и повседневных действий. Иллюстрация интерфейса.</desc>
